[project]
name = "cubepy"
version = "0.1.0"
description = "Python semantic layer + permission layer + API layer, modelled on Cube.js (FastAPI + SQLAlchemy 2.0)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",            # async PG driver for SQLAlchemy (Hologres speaks PG wire)
    "psycopg[binary]>=3.1",     # sync PG for tooling / test fixtures
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "redis>=5.0",               # async via redis.asyncio
    "strawberry-graphql[asgi]>=0.230",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "pyjwt[crypto]>=2.8",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",              # AsyncClient for FastAPI tests
    "fakeredis>=2.21",          # in-memory redis for cache unit tests
    "testcontainers[postgres]>=4.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cubepy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests requiring a real Postgres (testcontainers or CUBEPY_TEST_PG_DSN)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    # Dev/test JWT secrets are intentionally short; production sets CUBEPY_JWT_SECRET.
    "ignore:.*InsecureKeyLengthWarning:DeprecationWarning",
    "ignore:.*HMAC key.*below the minimum recommended length",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's canonical `Depends`/`Header`/`Query` in argument defaults.
ignore = ["E501", "B008"]
